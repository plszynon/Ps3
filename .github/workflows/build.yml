name: build
on: [push, workflow_dispatch]
jobs:
  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" -w /src ps3dev/ps3dev make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: NowaKarta-pkg
          path: "*.pkg"
